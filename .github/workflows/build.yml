name: Build GTPatcher VR APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Release APK for VR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Gradle Wrapper Manually
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Download wrapper files
          wget https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          wget https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew -O gradlew
          chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="" \
            -Pandroid.injected.signing.store.password="" \
            -Pandroid.injected.signing.key.alias="" \
            -Pandroid.injected.signing.key.password=""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTPatcher-Release-VR
          path: app/build/outputs/apk/release/*.apk
