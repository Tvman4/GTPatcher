name : Build GTPatcher VR APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Signed Release APK for VR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Properties & Generate Keystore
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          keytool -genkey -v -keystore release.jks -storepass password123 -alias GTPatcher -keypass password123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GTPatcher, O=VRMods, C=US"

      - name: Build Signed Release APK
        run: |
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="release.jks" \
            -Pandroid.injected.signing.store.password="password123" \
            -Pandroid.injected.signing.key.alias="GTPatcher" \
            -Pandroid.injected.signing.key.password="password123"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTPatcher-Release-Signed-VR
          path: app/build/outputs/apk/release/*.apk
