name: Build GTPatcher VR APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Release APK for VR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found yet, skipping chmod."
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease \
              -Pandroid.injected.signing.store.file="" \
              -Pandroid.injected.signing.store.password="" \
              -Pandroid.injected.signing.key.alias="" \
              -Pandroid.injected.signing.key.password=""
          else
            echo "Project structure missing Android/Gradle source files. Please add your Android project files to the repository."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTPatcher-Release-VR
          path: app/build/outputs/apk/release/*.apk
